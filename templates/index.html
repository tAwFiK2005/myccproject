<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload & Manage Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .list-group-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .list-group-item a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .progress {
            height: 25px;
            background-color: #d4edda;
            border-radius: 10px;
        }
        .progress-bar {
            background-color: #28a745;
            font-weight: bold;
        }
    </style>
    <script>
        function showProgress() {
            document.getElementById('progress').style.display = 'block';
        }

        function confirmDelete(event) {
            if (!confirm('Are you sure you want to delete this file?')) {
                event.preventDefault();
            }
        }
    </script>
</head>
<body>
<div class="container py-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card shadow-lg p-5">
        <h2 class="text-center mb-4 text-primary">📤 Upload a File</h2>
        <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="showProgress()">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" required>
            </div>
            <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit">Upload</button>
            </div>
        </form>
        <div id="progress" class="progress mt-4" style="display: none;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%">Uploading...</div>
        </div>
    </div>

    <div class="card shadow-lg p-5 mt-5">
        <h2 class="text-center mb-4 text-success">📂 Files Available</h2>
        <ul class="list-group list-group-flush">
            {% for file, url in files %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="{{ url }}" target="_blank">{{ file }}</a>
                <form action="/delete" method="POST" onsubmit="confirmDelete(event)">
                    <input type="hidden" name="filename" value="{{ file }}">
                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
